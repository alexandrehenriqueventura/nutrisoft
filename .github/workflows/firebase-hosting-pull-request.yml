name: Deploy to Firebase Hosting on Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Deploy Preview to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NUTRISOFT_DF543 }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > gcp_key.json
            export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp_key.json
            npx firebase-tools hosting:channel:deploy pr-${{ github.event.number }} --project nutrisoft-df543 --non-interactive
            rm -f gcp_key.json
          else
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_NUTRISOFT_DF543 não encontrada."
            exit 1
          fi
